<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Form Pendaftaran KTA PMII</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container py-5">

<div class="text-center mb-4">

<img src="images/logo-pmii.png" width="90">

<h2 class="mt-3">

FORM PENDAFTARAN KTA ONLINE

</h2>

<h5>

PENGURUS CABANG PMII PACITAN

</h5>

</div>

<div class="alert alert-warning shadow">

<h4 class="text-center">

💳 INFORMASI PEMBAYARAN

</h4>

<hr>

<h3 class="text-center text-primary">

Rp10.000

</h3>

<p class="text-center">

Transfer ke DANA

</p>

<h2 class="text-center text-success">

0851-2424-9513

</h2>

<p class="text-center">

Setelah melakukan pembayaran,
silakan upload bukti pembayaran
pada formulir di bawah.

</p>

</div>

 <form id="formKTA" enctype="multipart/form-data">

<div class="row">

<div class="col-md-6 mb-3">
<label class="form-label">Nama Lengkap <span class="text-danger">*</span></label>
<input type="text" id="nama" name="nama" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">NIK <span class="text-danger">*</span></label>
<input type="text" id="nik" name="nik" class="form-control" maxlength="16" required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Tempat Lahir <span class="text-danger">*</span></label>
<input type="text" id="tempat" name="tempat" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Tanggal Lahir <span class="text-danger">*</span></label>
<input type="date" id="tanggal" name="tanggal" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Jenis Kelamin <span class="text-danger">*</span></label>

<select id="jk" name="jk" class="form-select" required>

<option value="">Pilih</option>

<option>Laki-Laki</option>

<option>Perempuan</option>

</select>

</div>

<div class="col-md-6 mb-3">
<label class="form-label">Nomor HP / WhatsApp <span class="text-danger">*</span></label>
<input type="tel" id="hp" name="hp" class="form-control" required>
</div>

<div class="col-12 mb-3">
<label class="form-label">Alamat Lengkap <span class="text-danger">*</span></label>
<textarea id="alamat" name="alamat" class="form-control" rows="3" required></textarea>
</div>

<div class="col-md-4 mb-3">
<label class="form-label">Rayon <span class="text-danger">*</span></label>
<input type="text" id="rayon" name="rayon" class="form-control" required>
</div>

<div class="col-md-4 mb-3">
<label class="form-label">Komisariat <span class="text-danger">*</span></label>
<input type="text" id="komisariat" name="komisariat" class="form-control" required>
</div>

<div class="col-md-4 mb-3">
<label class="form-label">Cabang <span class="text-danger">*</span></label>
<input type="text"
class="form-control"
value="PC PMII PACITAN"
readonly>
</div>

</div>

<hr>

<h4 class="text-primary mb-3">
Upload Dokumen
</h4>

<div class="mb-3">

<label class="form-label">

Pas Foto 3x4

<span class="text-danger">*</span>

</label>

<input
type="file"
id="foto"
class="form-control"
accept="image/*"
required>

</div>

<div class="mb-3">

<label class="form-label">

Sertifikat MAPABA

<span class="text-danger">*</span>

</label>

<input
type="file"
id="sertifikat"
class="form-control"
accept=".jpg,.jpeg,.png,.pdf"
required>

</div>

<div class="mb-4">

<label class="form-label">

Bukti Pembayaran

<span class="text-danger">*</span>

</label>

<input
type="file"
id="bukti"
class="form-control"
accept="image/*"
required>

</div>

<div class="form-check mb-4">

<input
class="form-check-input"
type="checkbox"
id="setuju"
required>

<label class="form-check-label">

Saya menyatakan bahwa seluruh data yang saya isi adalah benar dan dapat dipertanggungjawabkan.

</label>

</div>

<div class="d-grid">

<button
type="submit"
class="btn btn-primary btn-lg">

KIRIM PENDAFTARAN

</button>

</div>

</form>

</div>

<script src="script.js"></script>

</body>

</html>
