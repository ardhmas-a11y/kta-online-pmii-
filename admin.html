<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dashboard Admin KTA PMII</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>

<body class="bg-light">

<!-- LOGIN -->

<div class="container py-5" id="loginPage">

<div class="row justify-content-center">

<div class="col-md-5">

<div class="card shadow">

<div class="card-body">

<div class="text-center">

<img src="images/logo-pmii.png" width="90">

<h3 class="mt-3">

LOGIN ADMIN

</h3>

<p>

Dashboard KTA Online PMII Pacitan

</p>

</div>

<div class="mb-3">

<label>Username</label>

<input
type="text"
id="username"
class="form-control">

</div>

<div class="mb-3">

<label>Password</label>

<input
type="password"
id="password"
class="form-control">

</div>

<div class="d-grid">

<button
class="btn btn-primary"
onclick="login()">

LOGIN

</button>

</div>

<div
id="pesan"
class="text-danger mt-3 text-center">

</div>

</div>

</div>

</div>

</div>

</div>

<!-- DASHBOARD -->

<div class="container py-5" id="dashboard" style="display:none;">

<div class="d-flex justify-content-between">

<h3>

Dashboard Admin

</h3>

<button
class="btn btn-danger"
onclick="logout()">

Logout

</button>

</div>

<hr>

<table class="table table-bordered">

<thead>

<tr>

<th>No Registrasi</th>

<th>Nama</th>

<th>No KTA</th>

<th>Status</th>

<th>Aksi</th>

</tr>

</thead>

<tbody id="data">

</tbody>

</table>

</div>

<script src="admin.js"></script>

</body>

</html>
